[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "miser1428-unionshape"
version = "0.1.0"
description = "按联合类型的每个分支尝试匹配，标出都不匹配的原因"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "miser1428" }]
keywords = ["analysis", "observability", "evaluation", "rag"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Utilities",
]

[project.urls]
Homepage = "https://miser1428.github.io"
Repository = "https://github.com/miser1428/unionshape"
Issues = "https://github.com/miser1428/unionshape/issues"

[project.scripts]
unionshape = "unionshape:main"

[tool.setuptools]
py-modules = ["unionshape"]
